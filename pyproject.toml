[project]
name = "voice-assistant"
version = "0.1.0"
description = "Offline voice assistant for Ubuntu that controls Spotify and sends Snapchat messages"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "openwakeword>=0.6",
    "playwright>=1.64.1",
    "spotipy>=2.26.0",
]

[project.scripts]
voice-assistant = "voice_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]
